<div class="px-4 sm:px-16 py-6">
    <div class="header w-full flex justify-between items-center px-4 sm:px-10 bg-slate-50 py-5 h-fit rounded-2xl">
        <div class="menu flex justify-center items-center gap-5">
            <div class="flex justify-center items-center gap-1 cursor-pointer" routerLink="/">
                <i class="fa-solid fa-envelope text-blue-500 text-2xl"></i>
                <h1 class="text-lg font-bold">Chat App</h1>
            </div>
        </div>
        <!-- <div class="px-6 py-2 bg-blue-300 text-white rounded-xl flex flex-row items-center gap-3 cursor-pointer hover:text-white hover:bg-blue-400 ease-in-out">
            <i class="fa-solid fa-plus text-lg mt-1"></i>
            <h1>New Message</h1>
        </div> -->
        <!-- <button (click)="handleNewMessage()" data-modal-target="default-modal" data-modal-toggle="default-modal">
            <i class="fa-solid fa-plus"></i>
            New Message
        </button> -->

        <div class="profile flex justify-center items-center gap-4">
            <div class="hidden sm:flex px-2 py-2 rounded-md border border-gray-300 cursor-pointer">
                <i class="fa-regular fa-bell fa-fade"></i>
            </div>
            <div class="relative inline-block text-left dropdown">
                <div tabindex="0"
                    class="w-10 h-10 hover:scale-105 transition-all translate-x-0 translate-y-0 hover:bg-gray-200 flex rounded-full bg-gray-100 justify-center items-center cursor-pointer">
                    <i *ngIf="!userData.name" class="fa-regular fa-user"></i>
                    <img *ngIf="userData.name" class="w-full h-full rounded-full" src="../../../assets/profileImg1.jpg"
                        alt="Profile Image">
                </div>
                <div
                    class="dropdown-content origin-top-right absolute left-1/2 -translate-x-1/2 mt-4 w-fit rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 transition-opacity ease-in-out duration-300 hidden z-10">
                    <div class="py-1">
                        <button (click)="gotoProfile()"
                            class="flex items-center px-2 mx-2 rounded-lg hover:text-white hover:bg-blue-400 cursor-pointer">
                            <i class="fa-solid fa-circle-user text-xl"></i>
                            <a class="block px-4 py-2 text-sm font-semibold" role="menuitem">Profile</a>
                        </button>
                        <button 
                            class="flex items-center px-2 mx-2 rounded-lg hover:text-white hover:bg-blue-400 cursor-progress">
                            <i class="fa-solid fa-gears"></i>
                            <a class="block px-4 py-2 text-sm font-semibold" role="menuitem">Settings</a>
                        </button>
                        <button (click)="handleLogout()"
                            class="flex hover:text-white items-center px-2 mx-2 rounded-lg hover:bg-red-500 cursor-pointer">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span class="block px-4 py-2 text-sm font-semibold" role="menuitem">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
