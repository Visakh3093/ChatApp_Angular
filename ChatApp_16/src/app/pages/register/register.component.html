
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mt-5">
    <div class="w-96 backdrop-blur-lg bg-opacity-80 rounded-lg shadow-lg p-5 bg-slate-50 text-white">
        <h2 class="text-2xl font-bold pb-5 text-gray-900">SignUp</h2>
        <form [formGroup]="formData" (submit)="handleSignUp()">
          <div class="mb-4">
            <label for="name" class="block mb-2 text-sm font-medium text-gray-700">Full name</label>
            <input
            formControlName="name"
              type="text"
              id="name"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full py-2.5 px-4"
              placeholder="Andrew Jackson"
              required
              value=""
            >
           
                  
              <span *ngIf="errorObj['name']" class="text-xs text-red-600">{{errorObj['name']}}</span>
          
          </div>
          <div class="mb-4">
            <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Email</label>
            <input
            formControlName="email"
              type="email"
              id="email"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full py-2.5 px-4"
              placeholder="andrew@mail.com"
              required
              value=""
            >
           
                  
              <span *ngIf="errorObj['email']" class="text-xs text-red-600">{{errorObj['email']}}</span>
       
          </div>
          <div class="mb-4">
            <label for="mobile" class="block mb-2 text-sm font-medium text-gray-700">Phone number</label>
            <input
            formControlName="mobile"
              type="text"
              id="mobile"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full py-2.5 px-4"
              placeholder="+91 000 000 0000"
              required
              value=""
            >
          
                  
              <span *ngIf="errorObj['mobile']" class="text-xs text-red-600">{{errorObj['mobile']}}</span>
          
          </div>
          <div class="mb-4">
            <label for="password" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
            <input
            formControlName="password"
              type="password"
              id="password"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full py-2.5 px-4"
              placeholder="*********"
              required
              value=""
            >
          
                  
              <span *ngIf="errorObj['password']" class="text-xs text-red-600">{{errorObj['password']}}</span>
        
          </div>
  
          <div>
            <p class="text-red-500 pb-5"></p>
          </div>
          <div class="flex items-center justify-between mb-4">
            <button
              type="submit"
              class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-2 focus:ring-blue-300 font-medium rounded-lg text-sm py-2.5 px-5 w-full sm:w-auto"
            >
              Register
            </button>
            <div class="flex items-center text-sm">
              <p class="text-gray-500">Already have an account?</p>
              <p class="underline cursor-pointer ml-1 text-blue-500 " routerLink="/login">Sign in</p>
            </div>
          </div>
        </form>
      </div>
  </div>
