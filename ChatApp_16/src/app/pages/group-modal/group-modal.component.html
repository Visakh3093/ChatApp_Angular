<div class="w-full h-screen fixed flex items-center justify-center bg-gray-900 bg-opacity-50 z-40">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md relative">
  
        <div class="flex justify-between items-center px-6 py-4 bg-blue-500 text-white rounded-t-lg">
            <h2 class="text-lg font-semibold">Create Group</h2>
            <button (click)="handleModalClose()" class="text-white hover:text-gray-200">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
  
        <div class="px-6 py-4">
            <form>
                <div class="mb-4">
                    <label for="groupName" class="block text-gray-700 font-medium mb-2">Group Name</label>
                    <input [(ngModel)]="groupName"  id="groupName" name="groupName" type="text"
                        class="w-full px-4 py-2 rounded-lg border-gray-300 shadow-sm focus:outline-none focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
                        placeholder="Enter group name" autocomplete="off">
                </div>

                <div class="relative mb-4">
                    <label for="searchUsers" class="block text-gray-700 font-medium mb-2">Search Users</label>
                    <input id="searchUsers" [(ngModel)]="userName" [value]="userName" name="searchUsers" type="text" (input)="onInputChange($event)"
                        class="w-full px-4 py-2 rounded-lg border-gray-300 shadow-sm focus:outline-none focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
                        placeholder="Type to search users" autocomplete="off">
                    
                    <div class="absolute top-full left-0 max-h-56 overflow-y-auto w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg z-50">
                        <div *ngFor="let user of users" class="px-4 py-2 hover:bg-blue-100 cursor-pointer"  (click)="manageUsers(user)">
                            <span class="text-black">{{ user.name }}</span>
                        </div>
                    </div>
                </div>

                <div class="w-full pb-2">
                    <div class="flex flex-wrap gap-2">
                        <div *ngFor="let item of userList" class="flex w-fit px-2 items-center bg-blue-400 rounded-md" tabindex="0">
                            <span class="text-white first-letter:capitalize">{{item.name}}</span>
                            <button (click)="removeUserList(item)" class="ml-2 text-red-400 hover:text-red-600">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end px-6 py-4 border-t border-gray-200">
                    <button (click)="handleCreateGroup()" class="ml-4 bg-blue-500 px-4 py-2 rounded-md text-white hover:bg-blue-600">Create Group</button>
                </div>
            </form>
        </div>
  
    </div>
</div>
